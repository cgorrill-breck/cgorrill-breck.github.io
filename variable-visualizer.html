<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Memory Visualizer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM (Loaded without crossorigin flags for local file compatibility) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script>
        const { useState, useMemo } = React;
        const h = React.createElement;

        // --- SVG Icon Components ---
        const Cpu = ({ className }) => h('svg', { xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className },
            h('rect', { width: "16", height: "16", x: "4", y: "4", rx: "2" }),
            h('rect', { width: "6", height: "6", x: "9", y: "9", rx: "1" }),
            h('path', { d: "M15 2v2" }), h('path', { d: "M15 20v2" }),
            h('path', { d: "M2 15h2" }), h('path', { d: "M2 9h2" }),
            h('path', { d: "M20 15h2" }), h('path', { d: "M20 9h2" }),
            h('path', { d: "M9 2v2" }), h('path', { d: "M9 20v2" })
        );

        const Plus = ({ className }) => h('svg', { xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className },
            h('path', { d: "M5 12h14" }), h('path', { d: "M12 5v14" })
        );

        const Trash2 = ({ className }) => h('svg', { xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className },
            h('path', { d: "M3 6h18" }),
            h('path', { d: "M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" }),
            h('path', { d: "M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" }),
            h('line', { x1: "10", x2: "10", y1: "11", y2: "17" }),
            h('line', { x1: "14", x2: "14", y1: "11", y2: "17" })
        );

        const Info = ({ className }) => h('svg', { xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className },
            h('circle', { cx: "12", cy: "12", r: "10" }),
            h('path', { d: "M12 16v-4" }),
            h('path', { d: "M12 8h.01" })
        );

        const AlertCircle = ({ className }) => h('svg', { xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className },
            h('circle', { cx: "12", cy: "12", r: "10" }),
            h('line', { x1: "12", x2: "12", y1: "8", y2: "12" }),
            h('line', { x1: "12", x2: "12.01", y1: "16", y2: "16" })
        );

        const HelpCircle = ({ className }) => h('svg', { xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className },
            h('circle', { cx: "12", cy: "12", r: "10" }),
            h('path', { d: "M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" }),
            h('path', { d: "M12 17h.01" })
        );

        // --- Application Constants & Logic ---
        const MEMORY_ROWS = 64;
        const MEMORY_COLS = 10;
        const TOTAL_BITS = MEMORY_ROWS * MEMORY_COLS;

        const JAVA_TYPES = {
            boolean: { size: 8, defaultVal: 'true', desc: '1 byte (allocated as 8 bits for alignment)' },
            byte: { size: 8, defaultVal: '127', desc: '8-bit signed integer' },
            short: { size: 16, defaultVal: '32000', desc: '16-bit signed integer' },
            char: { size: 16, defaultVal: 'A', desc: '16-bit Unicode character' },
            int: { size: 32, defaultVal: '42', desc: '32-bit signed integer' },
            float: { size: 32, defaultVal: '3.14', desc: '32-bit floating point (IEEE 754)' },
            long: { size: 64, defaultVal: '9000000000', desc: '64-bit signed integer' },
            double: { size: 64, defaultVal: '2.71828', desc: '64-bit floating point (IEEE 754)' },
        };

        const COLORS = [
            'bg-blue-500', 'bg-green-500', 'bg-purple-500', 'bg-pink-500',
            'bg-yellow-500', 'bg-orange-500', 'bg-teal-500', 'bg-indigo-500',
            'bg-red-500', 'bg-cyan-500', 'bg-lime-500', 'bg-fuchsia-500'
        ];

        const getBinaryRepresentation = (type, value) => {
            try {
                let binaryStr = '';
                const buffer = new ArrayBuffer(8);
                const view = new DataView(buffer);

                switch (type) {
                    case 'boolean':
                        return (value === 'true' || value === '1') ? '00000001' : '00000000';
                    case 'byte':
                        view.setInt8(0, parseInt(value) || 0);
                        binaryStr = view.getUint8(0).toString(2).padStart(8, '0');
                        break;
                    case 'short':
                        view.setInt16(0, parseInt(value) || 0);
                        binaryStr = view.getUint16(0).toString(2).padStart(16, '0');
                        break;
                    case 'char':
                        binaryStr = (value.charCodeAt(0) || 0).toString(2).padStart(16, '0');
                        break;
                    case 'int':
                        view.setInt32(0, parseInt(value) || 0);
                        binaryStr = view.getUint32(0).toString(2).padStart(32, '0');
                        break;
                    case 'float':
                        view.setFloat32(0, parseFloat(value) || 0);
                        binaryStr = view.getUint32(0).toString(2).padStart(32, '0');
                        break;
                    case 'long':
                        view.setBigInt64(0, BigInt(value.replace(/[^0-9-]/g, '')) || BigInt(0));
                        binaryStr = view.getBigUint64(0).toString(2).padStart(64, '0');
                        break;
                    case 'double':
                        view.setFloat64(0, parseFloat(value) || 0);
                        binaryStr = view.getBigUint64(0).toString(2).padStart(64, '0');
                        break;
                    default:
                        binaryStr = '0'.repeat(JAVA_TYPES[type].size);
                }
                return binaryStr;
            } catch (e) {
                return '0'.repeat(JAVA_TYPES[type].size);
            }
        };

        // --- Main App Component ---
        function App() {
            const [variables, setVariables] = useState([]);
            const [hoveredVarId, setHoveredVarId] = useState(null);

            const [garbageMemory] = useState(() =>
                Array.from({ length: TOTAL_BITS }, () => Math.random() > 0.5 ? '1' : '0')
            );

            const [formData, setFormData] = useState({
                type: 'int',
                name: 'myNumber',
                value: '42'
            });
            const [error, setError] = useState('');

            const handleAddVariable = (e) => {
                e.preventDefault();
                setError('');

                if (!/^[a-zA-Z_$][a-zA-Z_$0-9]*$/.test(formData.name)) {
                    setError("Invalid identifier name. Use letters, numbers, _, or $ (can't start with a number).");
                    return;
                }

                if (variables.some(v => v.name === formData.name)) {
                    setError("A variable with this name already exists in scope.");
                    return;
                }

                const sizeRequired = JAVA_TYPES[formData.type].size;
                const bitsUsed = variables.reduce((acc, v) => acc + v.size, 0);

                if (bitsUsed + sizeRequired > TOTAL_BITS) {
                    setError(`Stack Overflow! Not enough memory. Required: ${sizeRequired} bits, Available: ${TOTAL_BITS - bitsUsed} bits.`);
                    return;
                }

                const newVar = {
                    id: typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2),
                    name: formData.name,
                    type: formData.type,
                    value: formData.value,
                    size: sizeRequired,
                    startBit: bitsUsed,
                    color: COLORS[variables.length % COLORS.length],
                    binary: getBinaryRepresentation(formData.type, formData.value)
                };

                setVariables([...variables, newVar]);

                const nextTypes = Object.keys(JAVA_TYPES);
                const randomType = nextTypes[Math.floor(Math.random() * nextTypes.length)];
                setFormData({
                    type: randomType,
                    name: `var${variables.length + 1}`,
                    value: JAVA_TYPES[randomType].defaultVal
                });
            };

            const removeVariable = (id) => {
                const updatedVars = variables.filter(v => v.id !== id);

                let currentBit = 0;
                const defragmented = updatedVars.map(v => {
                    const updated = { ...v, startBit: currentBit };
                    currentBit += v.size;
                    return updated;
                });

                setVariables(defragmented);
            };

            const memoryGrid = useMemo(() => {
                const grid = [];
                let currentVarIndex = 0;
                let varBitOffset = 0;

                for (let i = 0; i < TOTAL_BITS; i++) {
                    const currentVar = variables[currentVarIndex];

                    if (currentVar && i >= currentVar.startBit && i < currentVar.startBit + currentVar.size) {
                        grid.push({
                            index: i,
                            allocated: true,
                            varId: currentVar.id,
                            name: currentVar.name,
                            color: currentVar.color,
                            value: currentVar.binary[varBitOffset]
                        });

                        varBitOffset++;
                        if (varBitOffset >= currentVar.size) {
                            currentVarIndex++;
                            varBitOffset = 0;
                        }
                    } else {
                        grid.push({
                            index: i,
                            allocated: false,
                            varId: null,
                            name: null,
                            color: 'bg-slate-200',
                            value: garbageMemory[i]
                        });
                    }
                }
                return grid;
            }, [variables, garbageMemory]);

            const bitsUsed = variables.reduce((acc, v) => acc + v.size, 0);
            const memoryUsagePercent = (bitsUsed / TOTAL_BITS) * 100;

            return h('div', { className: "min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col" },
                h('header', { className: "bg-slate-900 text-white p-4 shadow-md flex items-center justify-between" },
                    h('div', { className: "flex items-center gap-3" },
                        h(Cpu, { className: "w-8 h-8 text-blue-400" }),
                        h('div', null,
                            h('h1', { className: "text-xl font-bold tracking-tight" }, "Java Memory Visualizer"),
                            h('p', { className: "text-xs text-slate-400" }, "Contiguous physical memory allocation (640 bits total)")
                        )
                    ),
                    h('div', { className: "text-sm font-mono bg-slate-800 px-4 py-2 rounded-lg border border-slate-700" },
                        `Capacity: ${bitsUsed} / ${TOTAL_BITS} bits (${memoryUsagePercent.toFixed(1)}%)`
                    )
                ),
                h('main', { className: "flex-1 flex flex-col lg:flex-row p-4 gap-6 overflow-hidden" },
                    h('section', { className: "lg:w-1/3 flex flex-col gap-6 overflow-y-auto pr-2 pb-8" },
                        h('div', { className: "bg-white p-5 rounded-xl shadow-sm border border-slate-200" },
                            h('h2', { className: "text-lg font-semibold mb-4 flex items-center gap-2" },
                                h(Plus, { className: "w-5 h-5 text-blue-500" }),
                                " Allocate Variable"
                            ),
                            h('form', { onSubmit: handleAddVariable, className: "space-y-4" },
                                h('div', null,
                                    h('label', { className: "block text-sm font-medium text-slate-700 mb-1" }, "Data Type"),
                                    h('select', {
                                        className: "w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all",
                                        value: formData.type,
                                        onChange: (e) => {
                                            const type = e.target.value;
                                            setFormData({ ...formData, type, value: JAVA_TYPES[type].defaultVal });
                                        }
                                    },
                                        Object.keys(JAVA_TYPES).map(type =>
                                            h('option', { key: type, value: type }, `${type} (${JAVA_TYPES[type].size} bits)`)
                                        )
                                    ),
                                    h('p', { className: "text-xs text-slate-500 mt-1 flex items-center gap-1" },
                                        h(HelpCircle, { className: "w-3 h-3" }),
                                        ` ${JAVA_TYPES[formData.type].desc}`
                                    )
                                ),
                                h('div', null,
                                    h('label', { className: "block text-sm font-medium text-slate-700 mb-1" }, "Identifier (Name)"),
                                    h('input', {
                                        type: "text",
                                        className: "w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono text-sm",
                                        placeholder: "e.g. counter",
                                        value: formData.name,
                                        onChange: (e) => setFormData({ ...formData, name: e.target.value }),
                                        required: true
                                    })
                                ),
                                h('div', null,
                                    h('label', { className: "block text-sm font-medium text-slate-700 mb-1" }, "Initial Value"),
                                    h('input', {
                                        type: "text",
                                        className: "w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono text-sm",
                                        placeholder: "Value",
                                        value: formData.value,
                                        onChange: (e) => setFormData({ ...formData, value: e.target.value }),
                                        required: true
                                    })
                                ),
                                error ? h('div', { className: "bg-red-50 text-red-600 p-3 rounded-lg text-sm flex items-start gap-2 border border-red-100" },
                                    h(AlertCircle, { className: "w-5 h-5 shrink-0" }),
                                    h('p', null, error)
                                ) : null,
                                h('button', {
                                    type: "submit",
                                    className: "w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2",
                                    disabled: bitsUsed >= TOTAL_BITS
                                }, "Add to Memory")
                            )
                        ),
                        h('div', { className: "bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex-1" },
                            h('h2', { className: "text-lg font-semibold mb-4" }, "Symbol Table (Stack)"),
                            variables.length === 0 ? (
                                h('div', { className: "text-center p-8 border-2 border-dashed border-slate-200 rounded-xl text-slate-400" },
                                    h(Info, { className: "w-8 h-8 mx-auto mb-2 opacity-50" }),
                                    h('p', null, "Memory is empty."),
                                    h('p', { className: "text-sm" }, "Allocate a variable above to see it in memory.")
                                )
                            ) : (
                                h('div', { className: "space-y-3" },
                                    variables.map((v) =>
                                        h('div', {
                                            key: v.id,
                                            className: `flex items-center justify-between p-3 rounded-lg border-l-4 shadow-sm transition-all cursor-pointer ${hoveredVarId === v.id ? 'bg-slate-50 ring-2 ring-slate-200' : 'bg-white'} ${v.color.replace('bg-', 'border-')}`,
                                            onMouseEnter: () => setHoveredVarId(v.id),
                                            onMouseLeave: () => setHoveredVarId(null)
                                        },
                                            h('div', { className: "flex items-center gap-3" },
                                                h('div', { className: `w-3 h-3 rounded-full ${v.color}` }),
                                                h('div', null,
                                                    h('div', { className: "flex items-baseline gap-2" },
                                                        h('span', { className: "font-mono font-bold text-slate-800" }, v.name),
                                                        h('span', { className: "text-xs text-slate-500 font-mono" }, `=${v.value}`)
                                                    ),
                                                    h('div', { className: "text-xs text-slate-500 mt-0.5" },
                                                        h('span', { className: "font-semibold text-slate-600" }, v.type),
                                                        ` (${v.size} bits)`
                                                    )
                                                )
                                            ),
                                            h('button', {
                                                onClick: () => removeVariable(v.id),
                                                className: "text-slate-400 hover:text-red-500 p-2 transition-colors rounded-md hover:bg-red-50",
                                                title: "Free Memory"
                                            },
                                                h(Trash2, { className: "w-4 h-4" })
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    ),
                    h('section', { className: "lg:w-2/3 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col h-full" },
                        h('div', { className: "flex justify-between items-end mb-4" },
                            h('div', null,
                                h('h2', { className: "text-lg font-semibold flex items-center gap-2" }, "Physical Memory Grid"),
                                h('p', { className: "text-sm text-slate-500" }, "64 rows × 10 bits = 640 bits total. Unallocated bits show random garbage data.")
                            ),
                            h('div', { className: "flex gap-4 text-xs font-medium text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100" },
                                h('div', { className: "flex items-center gap-1.5" },
                                    h('div', { className: "w-3 h-3 rounded-sm bg-slate-200" }),
                                    " Unallocated"
                                ),
                                h('div', { className: "flex items-center gap-1.5" },
                                    h('div', { className: "w-3 h-3 rounded-sm bg-blue-500" }),
                                    " Allocated"
                                )
                            )
                        ),
                        h('div', { className: "flex-1 overflow-auto border-2 border-slate-800 rounded-lg bg-slate-900 p-4 shadow-inner relative" },
                            h('div', {
                                className: "grid gap-[2px] mx-auto",
                                style: {
                                    gridTemplateColumns: `repeat(${MEMORY_COLS}, minmax(0, 1fr))`,
                                    maxWidth: '600px'
                                }
                            },
                                memoryGrid.map((cell) => {
                                    const isHovered = hoveredVarId && hoveredVarId === cell.varId;
                                    const isAllocated = cell.allocated;
                                    return h('div', {
                                        key: cell.index,
                                        className: `
                                            relative group aspect-square flex items-center justify-center 
                                            text-[10px] sm:text-xs font-mono font-bold rounded-[2px] transition-all duration-200
                                            ${cell.color} 
                                            ${isAllocated ? 'text-white shadow-sm' : 'text-slate-400 opacity-60'}
                                            ${isHovered ? 'ring-2 ring-white scale-110 z-10 shadow-lg brightness-110' : ''}
                                            ${isAllocated && hoveredVarId && hoveredVarId !== cell.varId ? 'opacity-30' : ''}
                                            cursor-default
                                        `,
                                        onMouseEnter: () => cell.allocated && setHoveredVarId(cell.varId),
                                        onMouseLeave: () => cell.allocated && setHoveredVarId(null)
                                    },
                                        cell.value,
                                        isAllocated ? h('div', {
                                            className: "absolute opacity-0 group-hover:opacity-100 transition-opacity bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-900 text-white text-xs px-2 py-1 rounded whitespace-nowrap z-50 pointer-events-none shadow-xl border border-slate-700"
                                        },
                                            h('span', { className: "font-bold text-blue-300" }, cell.name),
                                            ` bit ${cell.index - (variables.find(v => v.id === cell.varId)?.startBit || 0)}`
                                        ) : null
                                    );
                                })
                            )
                        )
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>

</html>
