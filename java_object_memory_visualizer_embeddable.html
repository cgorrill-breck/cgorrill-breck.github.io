<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Object Memory Visualizer - Embeddable Component</title>
  
  <!-- Tailwind CSS CDN for premium utility-first styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM secure standard CDN builds -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler to interpret JSX within static servers safely -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0f172a; /* Neutral slate-900 baseline */
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Scrollbar adjustments for narrow iframe containers */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body class="text-slate-100 overflow-x-hidden antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Custom Inline SVGs to avoid loading latency or sandbox blocks inside secure frames
    const SvgIcon = ({ name, className = "w-5 h-5", ...props }) => {
      const icons = {
        layers: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 3L2 8l10 5 10-5-10-5z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        ),
        cpu: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <rect width="16" height="16" x="4" y="4" rx="2" />
            <rect width="6" height="6" x="9" y="9" rx="1" />
            <path strokeLinecap="round" d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" />
          </svg>
        ),
        play: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        rotateCcw: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89" />
          </svg>
        ),
        info: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        plus: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
          </svg>
        ),
        trash: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        ),
        compass: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        ),
        arrowRight: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        ),
        boxes: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
          </svg>
        ),
        settings: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        ),
        database: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <ellipse cx="12" cy="5" rx="9" ry="3" />
            <path strokeLinecap="round" d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3" />
          </svg>
        ),
        code: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        ),
        x: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        ),
        copy: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <rect width="13" height="13" x="9" y="9" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
          </svg>
        ),
        check: (
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
            <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        )
      };

      return (
        <span className={`inline-block ${className}`} {...props}>
          {icons[name] || null}
        </span>
      );
    };

    const PRESETS = {
      basic: {
        name: "SimpleUser",
        fields: [
          { id: '1', name: 'id', type: 'int', size: 4 },
          { id: '2', name: 'active', type: 'boolean', size: 1 },
          { id: '3', name: 'score', type: 'double', size: 8 }
        ],
        description: "A simple class showing mixed primitive types (double, int, boolean) and alignment padding."
      },
      nested: {
        name: "Node",
        fields: [
          { id: '1', name: 'value', type: 'int', size: 4 },
          { id: '2', name: 'next', type: 'Reference (Oop)', size: 4, isRef: true, refType: 'Node' }
        ],
        description: "Demonstrates reference variables (OOPs) pointing to other objects on the heap."
      },
      complex: {
        name: "CustomerProfile",
        fields: [
          { id: '1', name: 'vip', type: 'boolean', size: 1 },
          { id: '2', name: 'balance', type: 'double', size: 8 },
          { id: '3', name: 'age', type: 'int', size: 4 },
          { id: '4', name: 'rank', type: 'char', size: 2 },
          { id: '5', name: 'spouse', type: 'Reference (Oop)', size: 4, isRef: true, refType: 'CustomerProfile' }
        ],
        description: "A rich layout illustrating how HotSpot reorders fields to minimize padding, plus a mix of primitives and references."
      }
    };

    function App() {
      const [useCompressedOops, setUseCompressedOops] = useState(true);
      const [isEmbedMode, setIsEmbedMode] = useState(false);
      const [showEmbedModal, setShowEmbedModal] = useState(false);
      const [copied, setCopied] = useState(false);

      const [className, setClassName] = useState("CustomObject");
      const [fields, setFields] = useState([
        { id: '1', name: 'flag', type: 'boolean', size: 1 },
        { id: '2', name: 'count', type: 'int', size: 4 },
        { id: '3', name: 'child', type: 'Reference (Oop)', size: 4, isRef: true, refType: 'CustomObject' }
      ]);
      const [newFieldName, setNewFieldName] = useState("");
      const [newFieldType, setNewFieldType] = useState("int");

      const [simulationStep, setSimulationStep] = useState(0);
      const [heapObjects, setHeapObjects] = useState([]);
      const [stackFrames, setStackFrames] = useState([]);
      const [metaspaceBlueprints, setMetaspaceBlueprints] = useState([]);
      const [logs, setLogs] = useState([]);

      // Auto-detect embedding configurations from viewport frame properties
      useEffect(() => {
        if (typeof window !== 'undefined') {
          const isIFrame = window.self !== window.top;
          const hasEmbedParam = window.location.search.includes('embed=true');
          if (isIFrame || hasEmbedParam) {
            setIsEmbedMode(true);
          }
        }
      }, []);

      const loadPreset = (key) => {
        const preset = PRESETS[key];
        setClassName(preset.name);
        const updatedFields = preset.fields.map(f => {
          if (f.isRef) {
            return { ...f, size: useCompressedOops ? 4 : 8 };
          }
          return f;
        });
        setFields(updatedFields);
        resetSimulation();
        addLog(`Loaded preset "${preset.name}" class blueprint.`, 'info');
      };

      useEffect(() => {
        setFields(prev => prev.map(f => {
          if (f.isRef) {
            return { ...f, size: useCompressedOops ? 4 : 8 };
          }
          return f;
        }));
      }, [useCompressedOops]);

      const calculateClassLayout = (name, currentFields) => {
        const markWordSize = 8;
        const klassWordSize = useCompressedOops ? 4 : 8;
        const headerSize = markWordSize + klassWordSize;

        // Sort variables descending by size as standard HotSpot field reordering practice
        const sortedFields = [...currentFields].sort((a, b) => {
          if (b.size !== a.size) return b.size - a.size;
          if (a.isRef && !b.isRef) return 1;
          if (!a.isRef && b.isRef) return -1;
          return a.name.localeCompare(b.name);
        });

        let currentOffset = headerSize;
        const laidOutFields = [];

        sortedFields.forEach(field => {
          const alignmentGap = (field.size - (currentOffset % field.size)) % field.size;
          if (alignmentGap > 0) {
            laidOutFields.push({
              isPadding: true,
              offset: currentOffset,
              size: alignmentGap,
              name: 'Alignment Padding'
            });
            currentOffset += alignmentGap;
          }

          laidOutFields.push({
            ...field,
            offset: currentOffset,
            isPadding: false
          });
          currentOffset += field.size;
        });

        const alignmentBoundary = 8;
        const rawSize = currentOffset;
        const paddingRequired = (alignmentBoundary - (rawSize % alignmentBoundary)) % alignmentBoundary;
        const totalSize = rawSize + paddingRequired;

        const endPadding = paddingRequired > 0 ? {
          isPadding: true,
          offset: rawSize,
          size: paddingRequired,
          name: 'Loss-to-alignment Padding'
        } : null;

        if (endPadding) {
          laidOutFields.push(endPadding);
        }

        return {
          name,
          headerSize,
          markWordSize,
          klassWordSize,
          rawSize,
          totalSize,
          paddingRequired,
          eightByteBlocksCount: totalSize / 8,
          fields: laidOutFields
        };
      };

      const layout = calculateClassLayout(className, fields);

      const addField = () => {
        if (!newFieldName.trim()) return;
        
        let size = 4;
        let isRef = false;
        let refType = null;

        switch (newFieldType) {
          case 'boolean': size = 1; break;
          case 'byte': size = 1; break;
          case 'char': size = 2; break;
          case 'short': size = 2; break;
          case 'int': size = 4; break;
          case 'float': size = 4; break;
          case 'long': size = 8; break;
          case 'double': size = 8; break;
          case 'Reference (Oop)': 
            size = useCompressedOops ? 4 : 8; 
            isRef = true;
            refType = "AnyObject";
            break;
        }

        const newField = {
          id: Date.now().toString(),
          name: newFieldName.replace(/\s+/g, '_'),
          type: newFieldType,
          size,
          isRef,
          refType
        };

        setFields([...fields, newField]);
        setNewFieldName("");
        addLog(`Added field: ${newField.name} (${newField.type}, ${size}B)`, 'system');
      };

      const removeField = (id) => {
        const removed = fields.find(f => f.id === id);
        setFields(fields.filter(f => f.id !== id));
        if (removed) {
          addLog(`Removed field: ${removed.name}`, 'system');
        }
      };

      const addLog = (message, type = 'info') => {
        setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), message, type }]);
      };

      const resetSimulation = () => {
        setSimulationStep(0);
        setHeapObjects([]);
        setStackFrames([]);
        setMetaspaceBlueprints([]);
        addLog("Simulator reset. Ready to inspect JVM memory initialization.", "info");
      };

      const executeNextStep = () => {
        const nextStep = simulationStep + 1;
        setSimulationStep(nextStep);

        if (nextStep === 1) {
          addLog("JVM instruction detected: 'new' keyword. Consulting Metaspace metadata...", "info");
          addLog(`[METASPACE] Loaded blueprint for '${className}'. Structuring class metadata.`, "system");
          
          const newBlueprint = {
            className: layout.name,
            headerSize: layout.headerSize,
            totalSize: layout.totalSize,
            blocks: layout.eightByteBlocksCount,
            fieldLayout: layout.fields
          };
          setMetaspaceBlueprints([newBlueprint]);
          addLog(`[METASPACE] Calculated Object Size: ${layout.totalSize} bytes (${layout.eightByteBlocksCount} x 8-byte blocks)`, "success");
        } 
        else if (nextStep === 2) {
          addLog(`[HEAP] Allocating ${layout.eightByteBlocksCount} blocks (64-bit) of 8-bytes...`, "info");
          
          const address = "0x" + Math.floor(10000000 + Math.random() * 90000000).toString(16).toUpperCase();
          const byteBlocks = [];
          let currentBlockIndex = 0;

          const headerBytes = [
            ...Array(layout.markWordSize).fill({ label: "Mark Word", type: "header-mark" }),
            ...Array(layout.klassWordSize).fill({ label: "Klass Word", type: "header-klass" })
          ];

          const fieldBytes = [];
          layout.fields.forEach(f => {
            if (f.isPadding) {
              fieldBytes.push(...Array(f.size).fill({ label: "Padding", type: "padding" }));
            } else if (f.isRef) {
              fieldBytes.push(...Array(f.size).fill({ label: `${f.name} (Ref)`, type: "ref", field: f }));
            } else {
              fieldBytes.push(...Array(f.size).fill({ label: `${f.name} (${f.type})`, type: "primitive", field: f }));
            }
          });

          const allBytes = [...headerBytes, ...fieldBytes];

          for (let i = 0; i < allBytes.length; i += 8) {
            byteBlocks.push({
              blockIndex: currentBlockIndex++,
              bytes: allBytes.slice(i, i + 8)
            });
          }

          const newObject = {
            id: Date.now().toString(),
            className: className,
            address: address,
            totalSize: layout.totalSize,
            blocksCount: layout.eightByteBlocksCount,
            byteBlocks: byteBlocks,
            fields: layout.fields.filter(f => !f.isPadding),
            headerSize: layout.headerSize
          };

          setHeapObjects([newObject]);
          addLog(`[HEAP] Instantiated new ${className} at address ${address}. Headers & fields configured.`, "success");
        } 
        else if (nextStep === 3) {
          const targetObj = heapObjects[0];
          if (!targetObj) return;

          const newFrame = {
            methodName: "main",
            localVariables: [
              { name: "args", type: "String[]", value: "0x00000000" },
              { name: "objRef", type: className, value: targetObj.address, pointsTo: targetObj.id }
            ]
          };

          setStackFrames([newFrame]);
          addLog(`[STACK] Created local variable 'objRef' holding heap reference: ${targetObj.address}.`, "success");
          addLog("JVM initialization workflow complete!", "info");
        }
      };

      const embedCodeSnippet = `<iframe src="${typeof window !== 'undefined' ? window.location.href.split('?')[0] : ''}?embed=true" width="100%" height="750px" style="border:none; border-radius:16px; background:#0f172a;" allow="clipboard-write"></iframe>`;

      const copyEmbedCode = () => {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = embedCodeSnippet;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (err) {
          console.error('Failed to copy iframe snippet', err);
        }
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col relative selection:bg-indigo-500 selection:text-white">
          
          {/* HEADER STRIP - Collapsed inside Embed views to clean up space */}
          {!isEmbedMode && (
            <header className="border-b border-slate-800 bg-slate-950 px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-md">
              <div className="flex items-center space-x-3">
                <div className="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
                  <SvgIcon name="layers" className="h-6 w-6 text-indigo-400 animate-pulse" />
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-300 bg-clip-text text-transparent">
                    Java Object Memory Visualizer
                  </h1>
                  <p className="text-xs text-slate-400">
                    Interactive HotSpot JVM stack and heap offset mapping sandbox.
                  </p>
                </div>
              </div>

              {/* Configurations Toolbar */}
              <div className="flex flex-wrap items-center gap-3">
                <button
                  onClick={() => setShowEmbedModal(true)}
                  className="flex items-center gap-1.5 px-3 py-2 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white rounded-xl text-xs font-semibold transition-all"
                  title="Generate embed block"
                >
                  <SvgIcon name="code" className="w-4 h-4 text-slate-400" />
                  <span>Get Embed Code</span>
                </button>

                <div className="flex items-center gap-4 bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl">
                  <span className="text-xs font-medium text-slate-300 flex items-center gap-1">
                    <SvgIcon name="settings" className="w-4 h-4 text-slate-400" />
                    HotSpot Arch:
                  </span>
                  <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                    <button
                      onClick={() => {
                        setUseCompressedOops(true);
                        addLog("Enabled Compressed OOPs (Ordinary Object Pointers). References are now 4 bytes.", "info");
                      }}
                      className={`px-3 py-1 text-xs rounded font-medium transition-all ${
                        useCompressedOops 
                          ? 'bg-indigo-600 text-white shadow-md' 
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      Compressed (32-bit Refs)
                    </button>
                    <button
                      onClick={() => {
                        setUseCompressedOops(false);
                        addLog("Disabled Compressed OOPs. References expand to full native 8 bytes.", "info");
                      }}
                      className={`px-3 py-1 text-xs rounded font-medium transition-all ${
                        !useCompressedOops 
                          ? 'bg-indigo-600 text-white shadow-md' 
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      Uncompressed (64-bit Refs)
                    </button>
                  </div>
                </div>
              </div>
            </header>
          )}

          {/* EMBED MODE STRIP - Minimal control header for iframe widgets */}
          {isEmbedMode && (
            <div className="bg-slate-950/90 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between gap-4 sticky top-0 z-40 backdrop-blur">
              <div className="flex items-center gap-2">
                <SvgIcon name="layers" className="h-4 w-4 text-indigo-400 animate-pulse" />
                <span className="text-xs font-bold text-slate-200">JVM Object Visualizer</span>
              </div>

              <div className="flex items-center gap-2.5">
                <span className="text-[10px] text-slate-400">Compressed References:</span>
                <button
                  onClick={() => setUseCompressedOops(!useCompressedOops)}
                  className={`px-2 py-1 text-[10px] font-semibold rounded border transition-all ${
                    useCompressedOops 
                      ? 'bg-indigo-950 text-indigo-300 border-indigo-500/30' 
                      : 'bg-slate-900 text-slate-400 border-slate-800'
                  }`}
                >
                  {useCompressedOops ? "Enabled (4B)" : "Disabled (8B)"}
                </button>
                <div className="w-px h-3 bg-slate-800"></div>
                <button
                  onClick={() => setIsEmbedMode(false)}
                  className="text-[10px] font-medium text-indigo-400 hover:text-indigo-300"
                >
                  Exit Widget Mode
                </button>
              </div>
            </div>
          )}

          {/* WORKSPACE CONTENT AREA */}
          <main className={`flex-1 ${isEmbedMode ? 'p-3 gap-4' : 'p-6 gap-6'} flex flex-col max-w-[1920px] mx-auto w-full`}>
            
            {/* DESIGN CONTAINER: Class Architect & Sizing Metaspace side-by-side */}
            {}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              
              {/* Box 1: Class Builder Panel */}
              <div className="bg-slate-950/80 border border-slate-800/80 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <SvgIcon name="boxes" className="text-indigo-400 w-5 h-5" />
                    <h2 className="text-base font-bold text-slate-100">1. Class Structural Architect</h2>
                  </div>
                  <span className="px-2 py-0.5 text-[10px] uppercase tracking-wider font-extrabold bg-indigo-950 text-indigo-400 rounded-md border border-indigo-800">
                    Design Time
                  </span>
                </div>

                {/* Preset Fast Actions */}
                <div>
                  <span className="text-xs text-slate-400 font-medium block mb-2">Class Structure Blueprints:</span>
                  <div className="grid grid-cols-3 gap-2">
                    <button 
                      onClick={() => loadPreset('basic')}
                      className={`py-2 px-3 text-xs font-semibold rounded-xl border transition-all flex flex-col items-center justify-center text-center gap-0.5 ${
                        className === "SimpleUser" 
                          ? 'bg-indigo-900/30 text-indigo-300 border-indigo-500/50' 
                          : 'bg-slate-900/60 text-slate-300 border-slate-800 hover:bg-slate-900'
                      }`}
                    >
                      <span className="font-bold">SimpleUser</span>
                      <span className="text-[9px] text-slate-500 font-normal">Primitives</span>

                </div>
              </div>

              {/* High-Resolution informational content guidelines */}
              <div className="bg-slate-950 border border-slate-800/80 rounded-2xl p-6 shadow-xl">
                <h4 className="text-sm font-bold text-white mb-3 flex items-center gap-2">
                  <SvgIcon name="info" className="w-4 h-4 text-indigo-400" />
                  JVM Sizing Specifications
                </h4>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs text-slate-400 leading-relaxed">
                  <div className="space-y-3">
                    <div>
                      <h5 className="font-bold text-slate-200 mb-1">1. Metaspace Blueprint Computations</h5>
                      <p>
                        Each class blueprint loaded in the Metaspace informs the JVM exactly how many primitive bytes to allocate. Field reordering calculations compress variable layout configurations to keep structural spacing footprint highly compact.
                      </p>
                    </div>
                    <div>
                      <h5 className="font-bold text-slate-200 mb-1">2. Compressed Ordinary Object Pointers</h5>
                      <p>
                        By shifting reference pointer coordinates 3 bits right, the JVM stores 64-bit addresses inside 32-bit (4-byte) fields on standard heaps up to 32GB, conserving cache line availability.
                      </p>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div>
                      <h5 className="font-bold text-slate-200 mb-1">3. Alignment Padding Layouts</h5>
                      <p>
                        To maximize processor speed, variable offset start coordinates must align with values divisible by their byte sizes. Gaps are padded automatically to maintain 8-byte CPU cache boundary offsets.
                      </p>
                    </div>
                    <div>
                      <h5 className="font-bold text-slate-200 mb-1">4. Block Allocations</h5>
                      <p>
                        All Java object allocations round structural layouts directly up to nearest multiples of 8. This guarantees aligned memory boundaries, saving processor read cycle speeds.
                      </p>
                    </div>
                  </div>
                </div>
              </div>

            </div>

          </main>

          {/* FOOTER STRIP */}
          {!isEmbedMode && (
            <footer className="border-t border-slate-800 bg-slate-950 px-6 py-4 mt-12 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
              <span>HotSpot JVM Memory Emulation Engine &bull; Standalone Embed Module</span>
              <div className="flex items-center gap-4">
                <span className="flex items-center gap-1">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Emulation Active
                </span>
                <span>&copy; 2026 JVM Memory Visualizer</span>
              </div>
            </footer>
          )}

          {/* EMBED MODAL OVERLAY */}
          {}
          {showEmbedModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
                {/* Header */}
                <div className="bg-slate-950 px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <SvgIcon name="code" className="text-indigo-400 w-5 h-5" />
                    <h3 className="font-bold text-white text-base">Embed Generator Code</h3>
                  </div>
                  <button 
                    onClick={() => setShowEmbedModal(false)}
                    className="p-1 text-slate-400 hover:text-slate-200 rounded-lg hover:bg-slate-900 transition-colors"
                  >
                    <SvgIcon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Body Content */}
                <div className="p-6 space-y-4">
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Insert this visualizer tool within class slides, lecture pages, or blogs. The embed view automatically strips away footer and structural boundaries to lay inside components smoothly.
                  </p>

                  <div className="space-y-1.5">
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Iframe Embed Code Snippet</span>
                    <div className="relative">
                      <pre className="bg-slate-950 p-4 rounded-xl border border-slate-800 overflow-x-auto text-xs font-mono text-indigo-300 leading-relaxed whitespace-pre-wrap break-all pr-12">
                        {embedCodeSnippet}
                      </pre>
                      <button
                        onClick={copyEmbedCode}
                        className="absolute top-3 right-3 p-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-750 text-slate-300 rounded-lg transition-all"
                        title="Copy code"
                      >
                        {copied ? (
                          <SvgIcon name="check" className="w-4 h-4 text-emerald-400" />
                        ) : (
                          <SvgIcon name="copy" className="w-4 h-4" />
                        )}
                      </button>
                    </div>
                  </div>

                  <div className="bg-indigo-950/20 border border-indigo-900/40 rounded-xl p-3.5 space-y-2 text-xs text-indigo-300">
                    <span className="font-bold text-white flex items-center gap-1.5">
                      <SvgIcon name="info" className="w-4 h-4 text-indigo-400" /> Embedding Tips
                    </span>
                    <ul className="list-disc pl-4 space-y-1 text-[11px]">
                      <li>The widget supports fully responsive sizes. Height can be scaled in iframe properties to fit.</li>
                      <li>Query params like <code className="bg-slate-950 text-indigo-200 px-1 font-mono rounded">?embed=true</code> will override headers.</li>
                    </ul>
                  </div>
                </div>

                {/* Footer Controls */}
                <div className="bg-slate-950 px-6 py-4 border-t border-slate-800 flex items-center justify-between">
                  <button
                    onClick={() => {
                      setIsEmbedMode(true);
                      setShowEmbedModal(false);
                    }}
                    className="text-xs text-indigo-400 hover:text-indigo-300 font-bold"
                  >
                    Preview Embedded Widget View
                  </button>
                  <button
                    onClick={() => setShowEmbedModal(false)}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition-all"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
